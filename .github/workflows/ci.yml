name: CI

on:
  push:
    branches: [master, adding-features]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13
          cache: npm
      - name: Install Chrome runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: End-to-end tests
        run: npm run test:e2e
      # Two browser contexts against a live relay. Kept out of `npm test`
      # because it needs a browser that can complete a WebSocket handshake
      # against a local server, which not every development sandbox can do —
      # but CI can, and it is the only place the create-vs-join and
      # dormant-room policies are exercised over a real socket.
      - name: Live-relay sync tests
        run: npm run test:sync
